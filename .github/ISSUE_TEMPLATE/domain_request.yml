name: Domain guidance request
description: Propose better questions or cautions for an occupation
title: "[Domain]: "
labels: ["domain-guidance"]
body:
  - type: input
    id: occupation
    attributes:
      label: Occupation or domain
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing from the current guidance?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Authoritative sources or practitioner context
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I did not include real candidate personal data.
          required: true

